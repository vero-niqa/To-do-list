<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <main>
        <section>
        <h1>To-do list</h1>
        <form action="" id="form">

            <label for="">Name</label>
            <input type="text"><br>
            <br>

            <label for="">Date</label>
            <input type="date"><br><br>

            <label for="">Select priority</label>
            <select name="" id="priority">
                <option value="" select disabled>Select priority</option>
                <option value="">Low</option>
                <option value="">Medium</option>
                <option value="">High</option>
            </select><br><br>

            <button type="submit">Add</button>
            

            <h3>Task List</h3>
            <ul>
                <li>
                    
                        <input type="checkbox" id="walk">
                        <label>Take a walk</label>
                    
                </li>
                <li>
                    <input type="checkbox" id="icecream">
                    <label>Go for icecream</label>
                </li>    

                <li>
                    <input type="checkbox" id="nap">
                    <label>Take a nap</label>
                </li>    
                <li>
                    <input type="checkbox" id="netflix">
                    <label>Netflix and chill</label>
                </li>    
                <li>
                    <input type="checkbox" id="lunch">
                    <label>Go out for lunch</label>
                </li>    
            </ul>
            </section>

            <section>
                <h3>Completed tasks</h3>
                <ul>
                    <li>Read a book</li>
                    <li>Finish chores</li>
                </ul>
            </section>
        </form>
    </main>
</body>
</html>
